name: DMS Audit Coverage Gate

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'DMS-development-digitalmediafox/**'
      - '.github/workflows/audit-coverage-gate.yml'
  workflow_dispatch:

# Read-only gate: never deploys anything, separate from deploy-dms-backend.yml.
concurrency:
  group: dms-audit-coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DMS-development-digitalmediafox

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: dms_audit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql, gd, zip, curl, fileinfo, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=4
          CACHE_STORE=array
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=dms_audit_ci
          DB_USERNAME=root
          DB_PASSWORD=
          MAIL_MAILER=array
          PULSE_ENABLED=false
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          TELESCOPE_ENABLED=false
          EOF
          php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Import schema snapshot
        run: |
          mysql -h127.0.0.1 -P3306 -uroot dms_audit_ci < database/ci/schema-snapshot.sql

      - name: Apply table-ownership classification
        run: php artisan migrate --force --path=database/migrations/2026_08_11_120000_classify_dms_owned_audit_tables.php

      - name: Refresh audit registries
        run: |
          php artisan audit:generate-route-registry
          php artisan audit:generate-table-registry

      - name: Coverage regression gate
        run: php artisan audit:check-coverage-regression
